name: Jumpy
options:
  bundleIdPrefix: com.bernardogramaxo
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: WSNJWTG695
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Jumpy:
    type: application
    platform: iOS
    sources:
      - Jumpy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bernardogramaxo.jumpy
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Jumpy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Copy web game
        basedOnDependencyAnalysis: false
        script: |
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/web"
          rm -rf "$DEST" && mkdir -p "$DEST"
          cp -R "${PROJECT_DIR}/../index.html" "${PROJECT_DIR}/../css" "${PROJECT_DIR}/../js" "$DEST/"
