<title>Jumpy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="css/theme.css?v=202610140900">
<link rel="stylesheet" href="css/style.css?v=202610140900">
<script type="module" src="js/main.js"></script>
<main class="stage">
  <canvas class="stage__canvas" id="game" aria-label="Jumpy game view"></canvas>

  <div class="ui" id="ui">
    <header class="hud" data-hud>
      <p class="hud__field">
        <span class="hud__label">Height</span>
        <span class="hud__value"><span data-hud="height">0</span><span class="hud__unit">m</span></span>
      </p>
      <p class="hud__field">
        <span class="hud__label">Best</span>
        <span class="hud__value"><span data-hud="best">0</span><span class="hud__unit">m</span></span>
      </p>
      <button class="hud__mute" type="button" data-action="mute" aria-pressed="false" aria-label="Sound on. Turn sound off">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path class="hud__speaker" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
          <path class="hud__waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
          <path class="hud__cross" d="M15.5 9.5l5 5M20.5 9.5l-5 5" />
        </svg>
      </button>
    </header>

    <section class="screen" data-screen="start" aria-labelledby="start-title">
      <div class="sheet sheet--compact sheet--centered">
        <h1 class="sheet__title" id="start-title">Jumpy</h1>
        <div class="sheet__actions">
          <button class="button" type="button" data-action="play">Start climbing</button>
        </div>
      </div>
    </section>

    <section class="screen" data-screen="pause" aria-labelledby="pause-title" hidden>
      <div class="sheet sheet--compact">
        <h2 class="sheet__title sheet__title--small" id="pause-title">Paused</h2>
        <div class="sheet__actions">
          <button class="button" type="button" data-action="resume">Resume</button>
          <p class="hint">or press <kbd>Esc</kbd></p>
        </div>
      </div>
    </section>

    <section class="screen" data-screen="over" aria-labelledby="over-title" hidden>
      <div class="sheet sheet--compact sheet--centered">
        <p class="sheet__eyebrow" id="over-title"><span data-field="reason">You fell.</span> You reached</p>
        <div class="sheet__result">
          <p class="badge" data-new-best hidden>New best</p>
          <p class="sheet__score"><span data-field="height">0</span><span class="sheet__unit">m</span></p>
        </div>

        <dl class="tally">
          <div class="tally__row">
            <dt>Platforms</dt>
            <dd data-field="platforms">0</dd>
          </div>
          <div class="tally__row">
            <dt>Best</dt>
            <dd><span data-field="best">0</span> m</dd>
          </div>
        </dl>

        <div class="sheet__actions">
          <button class="button" type="button" data-action="play">Climb again</button>
        </div>
      </div>
    </section>
  </div>
</main>
